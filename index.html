<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AutoChinaDZ</title><style>*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#f4f5f7;color:#151515}header{background:#080808;color:#fff;padding:18px 22px;border-bottom:3px solid #e21d25}.logo{font-size:26px;font-weight:900}.logo span{color:#e21d25}.wrap{max-width:1200px;margin:auto;padding:0 20px}.hero{background:#111;color:#fff;padding:55px 0}.hero h1{font-size:46px;margin:0 0 10px}.hero h1 span{color:#e21d25}.hero p{font-size:18px;color:#ddd}.brands-section{background:#fff;padding:35px 0;margin-bottom:20px}.brands-section h2,.vehicles-title{font-size:32px;margin:0 0 25px;font-weight:800}.vehicles-title{margin:35px 0 20px}.brands-list{display:grid;grid-template-columns:repeat(6,1fr);gap:12px}.brand-card{height:100px;background:#fff;border:1px solid #e7e7e7;border-radius:14px;padding:15px;display:flex;align-items:center;justify-content:center;cursor:pointer;transition:.2s}.brand-card:hover{transform:translateY(-2px);box-shadow:0 5px 18px #0002}.brand-card.active{border:2px solid #e21d25}.brand-card img{width:72px;height:58px;object-fit:contain;display:block}.brand-fallback{font-weight:900;font-size:20px}.filters{display:grid;grid-template-columns:2fr 1fr 1fr 1fr;gap:10px;background:#fff;padding:18px;border-radius:12px;box-shadow:0 4px 20px #0002}input,select{width:100%;padding:12px;border:1px solid #ddd;border-radius:7px;background:#fff;font-size:15px}.status{margin:22px 0;padding:14px;background:#fff;border-radius:8px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:20px;padding-bottom:40px}.card{background:#fff;border-radius:12px;overflow:hidden;box-shadow:0 3px 18px #0002}.card img{width:100%;height:220px;object-fit:cover;background:#ddd}.body{padding:17px}.body h3{margin:0 0 8px;font-size:20px}.muted{color:#666}.price{color:#e21d25;font-size:20px;font-weight:bold;margin:12px 0}.btn{border:0;background:#e21d25;color:#fff;padding:11px 15px;border-radius:7px;font-weight:bold;cursor:pointer}.modal{display:none;position:fixed;inset:0;background:#000b;z-index:9999;overflow:auto;padding:20px}.panel{max-width:980px;margin:20px auto;background:#fff;border-radius:14px;padding:22px;position:relative}.close{position:absolute;right:14px;top:14px;border:0;background:#eee;border-radius:7px;padding:8px 12px;font-size:18px}.detail-img{width:100%;height:390px;object-fit:cover;border-radius:10px;background:#eee}.specs{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-top:15px}.spec{background:#f5f5f5;padding:13px;border-radius:8px}.spec b{display:block;margin-bottom:4px}.variant-box{margin:18px 0;padding:16px;background:#fafafa;border:1px solid #ececec;border-radius:10px}.verified{display:inline-block;margin:8px 0;padding:6px 9px;border-radius:999px;background:#edf8ef;font-size:12px;font-weight:700}.empty{grid-column:1/-1;background:#fff;padding:25px;border-radius:12px;text-align:center;color:#666}@media(max-width:800px){.brands-list{grid-template-columns:repeat(4,1fr)}.grid{grid-template-columns:1fr 1fr}.filters{grid-template-columns:1fr 1fr}}@media(max-width:520px){.brands-list{grid-template-columns:repeat(3,1fr);gap:9px}.brand-card{height:82px;padding:10px}.brand-card img{width:58px;height:48px}.grid,.filters,.specs{grid-template-columns:1fr}.hero{padding:42px 0}.hero h1{font-size:38px}.detail-img{height:240px}.panel{margin:0 auto;padding:16px}.brands-section h2,.vehicles-title{font-size:30px}.card img{height:210px}}</style></head><body><header><div class="wrap"><div class="logo">AUTO <span>CHINA</span> DZ</div></div></header><section class="hero"><div class="wrap"><h1>Auto<span>ChinaDZ</span></h1><p>Véhicules, importation et solutions automobiles depuis la Chine.</p></div></section><section class="brands-section"><div class="wrap"><h2>Nos marques</h2><div id="brands-list" class="brands-list"></div></div></section><main class="wrap"><h2 class="vehicles-title">Véhicules disponibles</h2><div class="filters"><input id="q" placeholder="Rechercher une marque ou un modèle"><select id="brand"><option value="">Toutes les marques</option></select><select id="year"><option value="">Toutes les années</option></select><select id="type"><option value="">Tous les types</option></select></div><div id="status" class="status">Chargement des véhicules...</div><div id="list" class="grid"></div></main><div id="modal" class="modal"><div class="panel"><button class="close" onclick="closeModal()">✕</button><div id="detail"></div></div></div><script>const SUPABASE_URL="https://dddoifppwastcsieaamc.supabase.co",SUPABASE_PUBLISHABLE_KEY="sb_publishable_aQCzbezOTkTn6KEnAwNrGA_ssrxd_6d";let vehicles=[],photos=[],currentVehicle=null,currentVariants=[];async function api(p){const r=await fetch(SUPABASE_URL+"/rest/v1/"+p,{headers:{apikey:SUPABASE_PUBLISHABLE_KEY,Authorization:"Bearer "+SUPABASE_PUBLISHABLE_KEY}});if(!r.ok)throw new Error(await r.text());return r.json()}function esc(v){return String(v??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]))}function placeholder(){return "data:image/svg+xml;charset=UTF-8,"+encodeURIComponent("<svg xmlns='http://www.w3.org/2000/svg' width='900' height='500'><rect width='100%' height='100%' fill='#ddd'/><text x='50%' y='50%' text-anchor='middle' font-family='Arial' font-size='28' fill='#666'>Photo non disponible</text></svg>")}function photoFor(id){const p=photos.find(x=>String(x.vehicle_id)===String(id));return p?.photo_url||p?.url||""}function uniq(a){return [...new Set(a.filter(v=>v!=null&&String(v).trim()).map(String))].sort((a,b)=>a.localeCompare(b,"fr",{numeric:true}))}const logoSlugs={Audi:"audi",BMW:"bmw","Mercedes-Benz":"mercedes",Volkswagen:"volkswagen",Cupra:"cupra",Peugeot:"peugeot",Citroën:"citroen",Renault:"renault",Dacia:"dacia",Toyota:"toyota",Nissan:"nissan",Volvo:"volvo",Kia:"kia",Hyundai:"hyundai",Geely:"geely",BYD:"byd",MG:"mg",Roewe:"roewe",Jetour:"jetour",GAC:"gac",Changan:"changan",Lynk:"lynkandco","Lynk & Co":"lynkandco",Zeekr:"zeekr",Xiaomi:"xiaomi",Aion:"aion",Haval:"haval",Hongqi:"hongqi",Omoda:"omoda",Skoda:"skoda",SEAT:"seat"};function logoUrl(b){const s=logoSlugs[b]||b.toLowerCase().replace(/[^a-z0-9]/g,"");return `https://cdn.simpleicons.org/${s}/111111`}function populateFilters(){const add=(id,a,l)=>document.getElementById(id).innerHTML=`<option value="">${l}</option>`+uniq(a).map(x=>`<option value="${esc(x)}">${esc(x)}</option>`).join("");add("brand",vehicles.map(v=>v.brand_fr||v.brand),"Toutes les marques");add("year",vehicles.map(v=>v.year),"Toutes les années");add("type",vehicles.map(v=>v.type),"Tous les types")}function populateBrands(){const brands=uniq(vehicles.map(v=>v.brand_fr||v.brand));document.getElementById("brands-list").innerHTML=brands.map(b=>`<button class="brand-card" data-brand="${esc(b)}" title="${esc(b)}" aria-label="${esc(b)}"><img src="${logoUrl(b)}" alt="${esc(b)}" onerror="this.outerHTML='<span class=&quot;brand-fallback&quot;>'+this.alt.slice(0,2).toUpperCase()+'</span>'"></button>`).join("");document.querySelectorAll(".brand-card").forEach(btn=>btn.onclick=()=>{document.getElementById("brand").value=btn.dataset.brand;document.querySelectorAll(".brand-card").forEach(x=>x.classList.toggle("active",x===btn));render();document.getElementById("list").scrollIntoView({behavior:"smooth"})})}function render(){const q=qEl.value.trim().toLowerCase(),brand=brandEl.value,year=yearEl.value,type=typeEl.value,f=vehicles.filter(v=>{const b=String(v.brand_fr||v.brand||""),m=String(v.model_fr||v.model||"");return(!q||(b+" "+m).toLowerCase().includes(q))&&(!brand||b===brand)&&(!year||String(v.year||"")===year)&&(!type||String(v.type||"")===type)});statusEl.textContent=`${f.length} véhicule(s) affiché(s) sur ${vehicles.length}`;listEl.innerHTML=f.length?f.map(v=>{const b=v.brand_fr||v.brand||"",m=v.model_fr||v.model||"",meta=[v.year,v.type,v.fuel||v.fuel_fr,v.transmission||v.gearbox_fr].filter(Boolean).join(" · ");return `<article class="card"><img src="${esc(photoFor(v.id)||placeholder())}" onerror="this.onerror=null;this.src=placeholder()"><div class="body"><h3>${esc(b)} ${esc(m)}</h3><p class="muted">${esc(meta||'Informations en cours de complétion')}</p>${v.price?`<div class="price">${esc(v.price)}</div>`:""}<button class="btn" onclick="openDetail('${esc(v.id)}')">Voir détails</button></div></article>`}).join(""):'<div class="empty">Aucun véhicule ne correspond à votre recherche.</div>'}function specs(v){return [["Année / السنة",v.year],["Type / النوع",v.type],["Carburant / الوقود",v.fuel||v.fuel_fr],["Moteur / المحرك",v.engine||v.engine_fr],["Puissance / القوة",v.power],["Boîte / علبة السرعات",v.transmission||v.gearbox_fr],["Couple / العزم",v.torque],["Places / المقاعد",v.seats],["Prix / السعر",v.price]].filter(x=>x[1]!=null&&String(x[1]).trim())}function renderDetail(){const v=currentVehicle,b=v.brand_fr||v.brand||"",m=v.model_fr||v.model||"",chosen=currentVariants[0],s=chosen?[["Année modèle / سنة الموديل",chosen.model_year],["Finition / الفئة",chosen.trim_name_fr],["Carrosserie / الهيكل",chosen.body_type_fr],["Carburant / الوقود",chosen.fuel_fr],["Moteur / المحرك",chosen.engine_fr],["Puissance / القوة",chosen.power_hp?chosen.power_hp+" ch":null],["Couple / العزم",chosen.torque_nm?chosen.torque_nm+" Nm":null],["Boîte / علبة السرعات",chosen.gearbox_fr],["Transmission / نظام الدفع",chosen.drivetrain],["Places / المقاعد",chosen.seats]].filter(x=>x[1]!=null&&String(x[1]).trim()):specs(v);detailEl.innerHTML=`<h2>${esc(b)} ${esc(m)}</h2><p class="muted">Fiche détaillée / بطاقة السيارة</p><img class="detail-img" src="${esc(photoFor(v.id)||placeholder())}" onerror="this.onerror=null;this.src=placeholder()">${currentVariants.length?`<div class="variant-box"><b>${currentVariants.length} finition(s) disponible(s)</b></div>`:""}<h3>Caractéristiques techniques / المواصفات التقنية</h3><div class="specs">${s.map(x=>`<div class="spec"><b>${esc(x[0])}</b>${esc(x[1])}</div>`).join("")}</div>`}async function openDetail(id){currentVehicle=vehicles.find(x=>String(x.id)===String(id));if(!currentVehicle)return;modalEl.style.display="block";detailEl.innerHTML="Chargement...";try{currentVariants=await api(`vehicle_variants?select=*&vehicle_id=eq.${encodeURIComponent(id)}&order=model_year.desc,trim_name_fr.asc`)}catch(e){currentVariants=[]}renderDetail()}function closeModal(){modalEl.style.display="none"}const qEl=document.getElementById("q"),brandEl=document.getElementById("brand"),yearEl=document.getElementById("year"),typeEl=document.getElementById("type"),statusEl=document.getElementById("status"),listEl=document.getElementById("list"),modalEl=document.getElementById("modal"),detailEl=document.getElementById("detail");[qEl,brandEl,yearEl,typeEl].forEach(x=>x.addEventListener("input",render));modalEl.onclick=e=>{if(e.target===modalEl)closeModal()};(async()=>{try{vehicles=await api("vehicles?select=*&archived=eq.false&order=brand_fr.asc,model_fr.asc");try{photos=await api("vehicle_photos?select=*&order=sort_order.asc")}catch(e){photos=[]}populateFilters();populateBrands();render()}catch(e){statusEl.textContent="Erreur de chargement des véhicules. Veuillez actualiser la page."}})();</script></body></html>

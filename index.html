<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>AutoChinaDZ</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#f4f5f7;color:#151515}
header{background:#080808;color:#fff;padding:18px 22px;border-bottom:3px solid #e21d25}
.logo{font-size:26px;font-weight:900}.logo span{color:#e21d25}
.wrap{max-width:1200px;margin:auto;padding:0 20px}

.vehicles-title{
  font-size:32px;
  margin:35px 0 20px;
  font-weight:800;
}

.brands-section{
  background:#fff;
  padding:35px 0;
  margin-bottom:20px;
}

.brands-section h2{
  font-size:32px;
  margin:0 0 25px;
  font-weight:800;
}

.brands-list{
  display:grid;
  grid-template-columns:repeat(6,1fr);
  gap:15px;
}

.brand-card{
  background:#fff;
  border:1px solid #eee;
  border-radius:12px;
  padding:18px 10px;
  text-align:center;
  cursor:pointer;
  transition:0.2s;
}

.brand-card:hover{
  transform:translateY(-3px);
  box-shadow:0 5px 18px #0002;
}

.brand-card img{
  width:70px;
  height:55px;
  object-fit:contain;
  margin-bottom:8px;
}

.brand-card span{
  display:block;
  font-weight:700;
  font-size:14px;
}

@media(max-width:800px){
  .brands-list{
    grid-template-columns:repeat(4,1fr);
  }

.hero{background:#111;color:#fff;padding:55px 0}.hero h1{font-size:46px;margin:0 0 10px}.hero h1 span{color:#e21d25}.hero p{font-size:18px;color:#ddd}
.filters{display:grid;grid-template-columns:2fr 1fr 1fr 1fr;gap:10px;background:#fff;padding:18px;margin-top:-25px;border-radius:12px;box-shadow:0 4px 20px #0002}
input,select{width:100%;padding:12px;border:1px solid #ddd;border-radius:7px;background:#fff}
.status{margin:22px 0;padding:14px;background:#fff;border-radius:8px}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:20px;padding-bottom:40px}
.card{background:#fff;border-radius:12px;overflow:hidden;box-shadow:0 3px 18px #0002}.card img{width:100%;height:230px;object-fit:cover;background:#ddd}
.body{padding:17px}.body h3{margin:0 0 8px;font-size:20px}.muted{color:#666}.price{color:#e21d25;font-size:21px;font-weight:bold;margin:14px 0}
.btn{border:0;background:#e21d25;color:#fff;padding:11px 15px;border-radius:7px;text-decoration:none;font-weight:bold;cursor:pointer;display:inline-block}
.btn.secondary{background:#222}
.modal{display:none;position:fixed;inset:0;background:#000b;z-index:9999;overflow:auto;padding:20px}
.panel{max-width:900px;margin:20px auto;background:#fff;border-radius:14px;padding:22px;position:relative}
.close{position:absolute;right:14px;top:14px;border:0;background:#eee;border-radius:7px;padding:8px 12px;font-size:18px;cursor:pointer}
.detail-img{width:100%;height:390px;object-fit:cover;border-radius:10px;background:#eee}
.specs{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-top:15px}.spec{background:#f5f5f5;padding:13px;border-radius:8px}.spec b{display:block;margin-bottom:4px}
@media(max-width:800px){.grid{grid-template-columns:1fr 1fr}.filters{grid-template-columns:1fr 1fr}}
@media(max-width:520px){.grid,.filters,.specs{grid-template-columns:1fr}.hero h1{font-size:34px}.detail-img{height:240px}.panel{margin:0 auto;padding:16px}}
</style>
</head>
<body>
<header><div class="wrap"><div class="logo">AUTO <span>CHINA</span> DZ</div></div></header>
<section class="hero"><div class="wrap"><h1>Auto<span>ChinaDZ</span></h1><p>Véhicules, importation et solutions automobiles depuis la Chine.</p></div></section>
<section class="brands-section">
<div class="wrap">
<h2>Nos marques</h2>
<div id="brands-list" class="brands-list"></div>
</div>
</section>
<main class="wrap">
 <h2 class="vehicles-title">Véhicules disponibles</h2>
<div class="filters">
<input id="q" placeholder="Rechercher une marque ou un modèle">
<select id="brand"><option value="">Toutes les marques</option></select>
<select id="year"><option value="">Toutes les années</option></select>
<select id="type"><option value="">Tous les types</option></select>
</div>
<div id="status" class="status">Chargement des véhicules...</div>
<div id="list" class="grid"></div>
</main>

<div id="modal" class="modal">
 <div class="panel">
  <button class="close" onclick="closeModal()">✕</button>
  <div id="detail"></div>
 </div>
</div>

<script>
const SUPABASE_URL="https://dddoifppwastcsieaamc.supabase.co";
const SUPABASE_PUBLISHABLE_KEY="sb_publishable_aQCzbezOTkTn6KEnAwNrGA_ssrxd_6d";
const BUCKET=SUPABASE_URL+"/storage/v1/object/public/vehicle-photos/";
let vehicles=[], photos=[];

async function api(path){
 const r=await fetch(SUPABASE_URL+"/rest/v1/"+path,{
   headers:{apikey:SUPABASE_PUBLISHABLE_KEY,Authorization:"Bearer "+SUPABASE_PUBLISHABLE_KEY}
 });
 if(!r.ok) throw new Error(await r.text());
 return r.json();
}
function esc(v){return String(v??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]));}
function photoFor(id){
 const p=photos.find(x=>String(x.vehicle_id)===String(id));
 return p?.photo_url || "";
}
function placeholder(){
 return "data:image/svg+xml;charset=UTF-8,"+encodeURIComponent("<svg xmlns='http://www.w3.org/2000/svg' width='900' height='500'><rect width='100%' height='100%' fill='#ddd'/><text x='50%' y='50%' text-anchor='middle' font-family='Arial' font-size='28' fill='#666'>Photo non disponible</text></svg>");
}
function populateFilters(){
 const add=(id,vals,label)=>{document.getElementById(id).innerHTML="<option value=''>"+label+"</option>"+[...new Set(vals.filter(Boolean))].sort().map(x=>"<option>"+esc(x)+"</option>").join("")};
 add("brand",vehicles.map(x=>x.brand_fr),"Toutes les marques");
 add("year",vehicles.map(x=>x.year),"Toutes les années");
 add("type",vehicles.map(x=>x.type),"Tous les types");
}
function render(){
 const q=document.getElementById("q").value.toLowerCase().trim(), b=document.getElementById("brand").value, y=document.getElementById("year").value, t=document.getElementById("type").value;
 const list=vehicles.filter(v=>(!q||((v.brand_fr||"")+" "+(v.model_fr||"")).toLowerCase().includes(q))&&(!b||v.brand_fr==b)&&(!y||String(v.year)==String(y))&&(!t||v.type==t));
 document.getElementById("status").textContent=list.length+" véhicule(s) disponible(s)";
 document.getElementById("list").innerHTML=list.map(v=>{
   const img=photoFor(v.id)||placeholder();
   return `<article class="card">
    <img src="${esc(img)}" alt="${esc(v.brand_fr+" "+v.model_fr)}" onerror="this.src=placeholder()">
    <div class="body"><h3>${esc(v.brand_fr)} ${esc(v.model_fr)}</h3>
    <div class="muted">${esc(v.type||"")} ${v.gearbox_fr?"· "+esc(v.gearbox_fr):""}</div>
    <div class="price">${esc(v.price||"Prix à confirmer")}</div>
    <button class="btn" onclick="openDetail(${Number(v.id)})">Voir détails</button>
    <a class="btn secondary" target="_blank" href="https://wa.me/213770230248">WhatsApp</a>
    </div></article>`;
 }).join("");
}
function openDetail(id){
 const v=vehicles.find(x=>String(x.id)===String(id)); if(!v)return;
 const img=photoFor(id)||placeholder();
 const specs=[
 ["Année / السنة",v.year],["Type / النوع",v.type],["Moteur / المحرك",v.engine_fr],
 ["Puissance / القوة",v.power],["Couple / عزم الدوران",v.torque],
 ["Boîte / علبة السرعات",v.gearbox_fr],["Places / المقاعد",v.seats],["Prix / السعر",v.price]
 ].filter(x=>x[1]!==null&&x[1]!==undefined&&x[1]!=="");
 document.getElementById("detail").innerHTML=
 `<h2>${esc(v.brand_fr)} ${esc(v.model_fr)}</h2>
  <p class="muted">Fiche détaillée / بطاقة السيارة</p>
  <img class="detail-img" src="${esc(img)}" onerror="this.src=placeholder()" alt="">
  <h3>Caractéristiques / المواصفات</h3>
  <div class="specs">${specs.map(x=>`<div class="spec"><b>${esc(x[0])}</b>${esc(x[1])}</div>`).join("")}</div>
  <p style="margin-top:20px"><a class="btn" target="_blank" href="https://wa.me/213770230248">Contacter sur WhatsApp</a></p>`;
 document.getElementById("modal").style.display="block";
}
function closeModal(){document.getElementById("modal").style.display="none"}
["q","brand","year","type"].forEach(id=>document.getElementById(id).addEventListener("input",render));
document.getElementById("modal").addEventListener("click",e=>{if(e.target.id==="modal")closeModal()});

(async()=>{
 try{
   [vehicles,photos]=await Promise.all([
     api("vehicles?select=*&available=eq.true&order=created_at.desc"),
     api("vehicle_photos?select=vehicle_id,photo_url,sort_order&order=sort_order.asc")
   ]);
   populateFilters(); render();
 }catch(e){
   console.error(e);
   document.getElementById("status").textContent="Impossible de charger les données Supabase. Vérifiez la clé Publishable et les politiques RLS.";
 }
})();
</script>
</body>
</html>
